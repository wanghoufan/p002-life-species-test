name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 静态导出没有服务端：API 路由只属于 Vercel 主线，构建镜像时移除（前端会走本机评分兜底）
      - name: Remove API routes for static export
        run: rm -rf src/app/api
      - name: Build static export
        run: pnpm next build
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /p002-life-species-test
          NEXT_PUBLIC_BASE_PATH: /p002-life-species-test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
